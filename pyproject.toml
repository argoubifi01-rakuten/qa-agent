[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qa-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
qa-agent = "qa_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
